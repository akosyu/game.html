<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大富豪 ONLINE | ロード中</title><style>*{box-sizing:border-box}body{margin:0;background:#142f2b;color:#f6ebcf;font:16px system-ui;min-height:100dvh;display:grid;place-items:center;text-align:center}main{padding:28px;width:min(440px,100%)}h1{color:#e5c17d;font-size:clamp(26px,7vw,38px)}.ring{margin:36px auto;width:92px;height:92px;position:relative;display:grid;place-items:center}.ring:before{content:'';position:absolute;inset:0;border:5px solid #36554b;border-top-color:#e5c17d;border-radius:50%;animation:spin 1.1s linear infinite}.card{background:#faf0d8;color:#142f2b;font-size:38px;width:44px;height:60px;border-radius:6px;display:grid;place-items:center;transform:rotate(-10deg)}@keyframes spin{to{transform:rotate(360deg)}}.track{height:5px;background:#36554b;border-radius:5px;overflow:hidden;margin:24px 0}.track:after{content:'';display:block;width:40%;height:100%;background:#e5c17d;animation:slide 1.8s ease-in-out infinite alternate}@keyframes slide{to{transform:translateX(150%)}}small{color:#c5d1cb}button,a{color:#e5c17d;font:inherit}button{background:transparent;border:1px solid #e5c17d;border-radius:8px;padding:10px;margin:8px}@media(prefers-reduced-motion:reduce){.ring:before,.track:after{animation:none}}</style></head><body><main><h1>大富豪 ONLINE</h1><div class="ring" aria-hidden="true"><div class="card">♠</div></div><h2 id="status" role="status">ロード中…</h2><p id="message">ゲームサーバーを起動しています。</p><div class="track" aria-hidden="true"></div><small>起動が完了すると自動的にゲーム画面へ移動します。</small><div id="retry" hidden><button onclick="start()">再試行</button><a id="direct">直接ゲームを開く</a></div><noscript>JavaScriptを有効にしてください。</noscript></main><script>const base='https://daifugo-online-akosyu.onrender.com';const room=new URLSearchParams(location.search).get('room');const target=base+'/'+(/^[a-f0-9]{6}$/i.test(room||'')?'?room='+encodeURIComponent(room.toUpperCase()):'');document.getElementById('direct').href=target;let running=false;async function start(){if(running)return;running=true;document.getElementById('retry').hidden=true;document.getElementById('status').textContent='ロード中…';document.getElementById('message').textContent='ゲームサーバーを起動しています。';const until=Date.now()+120000;while(Date.now()<until){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(base+'/ready',{cache:'no-store',signal:ctl.signal});if(r.ok){const d=await r.json();if(d.ready===true&&d.game==='daifugo'){location.replace(target);return}}}catch{}finally{clearTimeout(timer)}await new Promise(r=>setTimeout(r,2500))}running=false;document.getElementById('status').textContent='接続を確認できませんでした';document.getElementById('message').textContent='時間をおいて再試行してください。';document.getElementById('retry').hidden=false}start();</script></body></html>
